<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0b0e14"/>
  <!-- 8-bit pixel sakura blossom -->
  <!-- Top petal -->
  <rect x="7" y="2" width="2" height="1" fill="#f2a2b6"/>
  <rect x="6" y="3" width="4" height="2" fill="#f2a2b6"/>
  <!-- Left petal -->
  <rect x="2" y="7" width="1" height="2" fill="#f2a2b6"/>
  <rect x="3" y="6" width="2" height="4" fill="#f2a2b6"/>
  <!-- Right petal -->
  <rect x="13" y="7" width="1" height="2" fill="#f2a2b6"/>
  <rect x="11" y="6" width="2" height="4" fill="#f2a2b6"/>
  <!-- Bottom-left petal -->
  <rect x="3" y="11" width="3" height="2" fill="#f2a2b6"/>
  <rect x="4" y="13" width="2" height="1" fill="#f2a2b6"/>
  <!-- Bottom-right petal -->
  <rect x="10" y="11" width="3" height="2" fill="#f2a2b6"/>
  <rect x="10" y="13" width="2" height="1" fill="#f2a2b6"/>
  <!-- Petal inner body -->
  <rect x="5" y="5" width="6" height="6" fill="#f7b7c7"/>
  <!-- Center pistil -->
  <rect x="7" y="7" width="2" height="2" fill="#e5c07b"/>
  <rect x="7" y="6" width="2" height="1" fill="#ff7b72"/>
  <rect x="7" y="9" width="2" height="1" fill="#ff7b72"/>
  <rect x="6" y="7" width="1" height="2" fill="#ff7b72"/>
  <rect x="9" y="7" width="1" height="2" fill="#ff7b72"/>
</svg>
